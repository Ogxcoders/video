<VirtualHost *:80>
    ServerName v.ogtemplate.com
    ServerAlias www.v.ogtemplate.com
    
    DocumentRoot /var/www/html
    
    # =========================================================================
    # CRITICAL: Alias for /content/ URL to /media/content/ directory
    # This allows https://v.ogtemplate.com/content/... to serve files from
    # /var/www/html/media/content/...
    # =========================================================================
    Alias /content /var/www/html/media/content
    
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    <Directory /var/www/html/media>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Media Content Directory - processed videos, HLS, thumbnails
    <Directory /var/www/html/media/content>
        Options -Indexes +FollowSymLinks
        Require all granted
        AllowOverride All
        
        <IfModule mod_headers.c>
            Header set Access-Control-Allow-Origin "*"
            Header set Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
            Header set Access-Control-Allow-Headers "Range, Accept-Encoding, Origin"
            Header set Access-Control-Expose-Headers "Content-Length, Content-Range"
        </IfModule>
        
        # Enable byte-range serving for video streaming
        <IfModule mod_headers.c>
            <FilesMatch "\.(mp4|webm|ts)$">
                Header set Accept-Ranges "bytes"
            </FilesMatch>
        </IfModule>
    </Directory>
    
    # Media Uploads Directory - source files from WordPress
    <Directory /var/www/html/media/uploads>
        Options -Indexes +FollowSymLinks
        Require all granted
        AllowOverride All
    </Directory>

    # MIME types for media files
    <IfModule mod_mime.c>
        AddType application/vnd.apple.mpegurl .m3u8
        AddType video/MP2T .ts
        AddType video/mp4 .mp4
        AddType video/webm .webm
        AddType image/webp .webp
    </IfModule>
    
    ErrorLog ${APACHE_LOG_DIR}/v.ogtemplate.com-error.log
    CustomLog ${APACHE_LOG_DIR}/v.ogtemplate.com-access.log combined
    
    <IfModule mod_rewrite.c>
        RewriteEngine On
    </IfModule>
</VirtualHost>

# =========================================================================
# SETUP INSTRUCTIONS FOR VPS
# =========================================================================
# 1. Copy this file to: /etc/apache2/sites-available/v.ogtemplate.com.conf
# 
# 2. Enable required Apache modules:
#    sudo a2enmod rewrite headers expires mime alias
# 
# 3. Enable the site:
#    sudo a2ensite v.ogtemplate.com.conf
# 
# 4. Test configuration:
#    sudo apache2ctl configtest
# 
# 5. Restart Apache:
#    sudo systemctl restart apache2
# 
# 6. Set correct permissions on media directories:
#    sudo chown -R www-data:www-data /var/www/html/media
#    sudo chmod -R 755 /var/www/html/media
# 
# 7. Test file access:
#    curl -I https://v.ogtemplate.com/content/2024/11/12345/thumbnail.webp
# =========================================================================
